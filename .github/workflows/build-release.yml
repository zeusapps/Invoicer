name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        run: dotnet test tests/Invoicer.Tests/Invoicer.Tests.csproj -c Release

      - name: Build
        run: dotnet build src/Invoicer/Invoicer.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Annotated tag messages become the release notes. A shallow clone does not
      # fetch the tag objects that carry them, and without fetch-tags checkout
      # creates a lightweight local tag pointing straight at the commit - on which
      # %(contents) silently yields the commit message instead of the annotation.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Error "Tag '$tag' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/Invoicer/Invoicer.csproj -c Release -o publish-output -p:Version=${{ steps.version.outputs.version }}

      - name: Zip artifact
        run: Compress-Archive -Path publish-output/Invoicer.exe -DestinationPath Invoicer-${{ github.ref_name }}.zip

      - name: Read the tag annotation
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Guard the lightweight-tag case explicitly: %(contents) falls back to the
          # commit message there, which would put the whole commit body and its
          # trailers into user-facing release notes without anything failing.
          $type = (git cat-file -t $tag).Trim()
          if ($type -ne 'tag') {
            Write-Host "::warning::Tag $tag is not annotated; release notes will be auto-generated only."
            $notes = ''
          } else {
            $notes = (git tag -l --format='%(contents)' $tag) -join "`n"
          }
          "notes<<TAG_NOTES_EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "TAG_NOTES_EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Without a body the release is published empty, and the in-app update
          # dialog then has nothing to show but "(no release notes)".
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          files: Invoicer-${{ github.ref_name }}.zip
