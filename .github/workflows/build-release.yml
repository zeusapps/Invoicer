name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        run: dotnet test tests/Invoicer.Tests/Invoicer.Tests.csproj -c Release

      - name: Build
        run: dotnet build src/Invoicer/Invoicer.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Error "Tag '$tag' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/Invoicer/Invoicer.csproj -c Release -o publish-output -p:Version=${{ steps.version.outputs.version }}

      - name: Zip artifact
        run: Compress-Archive -Path publish-output/Invoicer.exe -DestinationPath Invoicer-${{ github.ref_name }}.zip

      - name: Read the tag annotation
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Read the tag object from the API rather than from the checkout. On a tag push
          # actions/checkout materialises the ref from the commit SHA, so the local tag is
          # lightweight and carries no annotation at all - no fetch depth or fetch-tags
          # setting changes that. The API always has the real object.
          $ref = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" | ConvertFrom-Json
          if ($ref.object.type -ne 'tag') {
            Write-Host "::warning::Tag $tag is not annotated; release notes will be auto-generated only."
            $notes = ''
          } else {
            $notes = (gh api "repos/${{ github.repository }}/git/tags/$($ref.object.sha)" --jq '.message') -join "`n"
          }
          "notes<<TAG_NOTES_EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "TAG_NOTES_EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Without a body the release is published empty, and the in-app update
          # dialog then has nothing to show but "(no release notes)".
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          files: Invoicer-${{ github.ref_name }}.zip
